<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{font-family:Inter,system-ui,sans-serif;background:rgb(249,247,238);color:rgb(42,40,37);position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#EE342F}
.wrap{position:absolute;left:90px;top:72px;right:80px;bottom:64px;display:flex;gap:56px}
.left{flex:1.5;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:28px}
.brand svg{width:56px;height:56px}
.live{margin-left:6px;display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:.06em;color:#EE342F;border:2px solid #EE342F;border-radius:999px;padding:5px 14px 5px 12px}
.live i{width:10px;height:10px;border-radius:50%;background:#EE342F}
h1{margin-top:48px;font-size:68px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
h1 span{color:#EE342F}
p.sub{margin-top:26px;font-size:28px;line-height:1.35;color:rgb(120,118,113);max-width:520px}
.right{flex:1;padding-top:6px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.card{background:rgb(253,252,250);border:1.5px solid rgba(33,34,30,.14);border-radius:18px;padding:22px 24px;display:flex;gap:20px;align-items:center;box-shadow:0 2px 0 rgba(33,34,30,.04)}
.vote{flex:none;width:58px;height:66px;border-radius:12px;border:1.5px solid rgba(33,34,30,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgb(120,118,113)}
.vote svg{width:30px;height:30px}
.card.top .vote{background:#EE342F;border-color:#EE342F;color:#fff}
.line{height:14px;border-radius:7px;background:rgb(240,238,235)}
.lines{flex:1;display:flex;flex-direction:column;gap:12px}
.card.top{transform:translateX(-26px);border-color:rgba(238,52,47,.45)}
.card.ask{border-style:dashed;color:rgb(120,118,113);font-size:22px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
 <div class="left">
  <div class="brand">
   <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#EE342F"/><circle cx="30" cy="30" r="15" fill="none" stroke="#fff" stroke-width="7"/><path d="M41 41 L49 49" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>
   Convex AMA <span class="live"><i></i>LIVE</span>
  </div>
  <h1>Ask the founders.<br><span>Upvote</span> the best.</h1>
  <p class="sub">Drop your question for the live stream. The top ones get answered on air.</p>
 </div>
 <div class="right">
  <div class="card top"><div class="vote"><svg viewBox="0 0 24 24"><path d="M12 5l7 8h-4.5v6h-5v-6H5z" fill="currentColor"/></svg></div><div class="lines"><div class="line" style="width:92%"></div><div class="line" style="width:64%"></div></div></div>
  <div class="card"><div class="vote"><svg viewBox="0 0 24 24"><path d="M12 5l7 8h-4.5v6h-5v-6H5z" fill="currentColor"/></svg></div><div class="lines"><div class="line" style="width:84%"></div><div class="line" style="width:48%"></div></div></div>
  <div class="card"><div class="vote"><svg viewBox="0 0 24 24"><path d="M12 5l7 8h-4.5v6h-5v-6H5z" fill="currentColor"/></svg></div><div class="lines"><div class="line" style="width:74%"></div></div></div>
  <div class="card ask">What would you like to ask?</div>
 </div>
</div>
</body></html>
